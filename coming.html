<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon — earnbangla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0F;
    --bg-elev:#0F0F17;
    --panel:#14141F;
    --panel-2:#191926;
    --border:#232333;
    --orange:#FF7A1A;
    --orange-2:#FF3D1E;
    --text:#F4F4F8;
    --text-dim:#9A9AAD;
    --text-faint:#67677A;
    --radius:16px;
    --grad-orange:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 100%);
    --sh-sm:0 4px 14px rgba(0,0,0,0.28);
    --sh-md:0 12px 28px rgba(0,0,0,0.38);
    --sh-lg:0 24px 60px rgba(0,0,0,0.5);
    --sh-orange:0 10px 26px rgba(255,61,30,0.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  img{display:block;max-width:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    display:flex;flex-direction:column;
  }
  .display{font-family:'Sora',sans-serif;}
  .icon{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* starfield */
  .stars{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 85% 8%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 92% 35%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.5px 1.5px at 15% 75%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,0.28), transparent),
      radial-gradient(1px 1px at 65% 12%, rgba(255,255,255,0.22), transparent),
      radial-gradient(1.5px 1.5px at 95% 80%, rgba(255,255,255,0.3), transparent);
    background-size:100% 100%;
  }

  /* Top brand bar */
  .topbar{
    position:relative;z-index:1;
    padding:22px 28px;
    display:flex;align-items:center;
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    font-family:'Sora',sans-serif;font-weight:800;font-size:19px;
  }
  .brand .mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--grad-orange);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;color:#fff;flex-shrink:0;
    box-shadow:var(--sh-orange);
  }
  .brand .bangla{
    background:var(--grad-orange);-webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* Main */
  .main{
    position:relative;z-index:1;flex:1;
    display:flex;align-items:center;justify-content:center;
    padding:40px 24px 60px;
  }
  .card{
    max-width:520px;width:100%;
    text-align:center;
  }
  .badge-icon{
    width:88px;height:88px;border-radius:24px;
    margin:0 auto 30px;
    background:var(--grad-orange);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--sh-orange);
    animation:float 3.5s ease-in-out infinite;
  }
  .badge-icon .icon{width:40px;height:40px;color:#fff;stroke-width:1.6;}
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:700;color:var(--orange);
    background:rgba(255,122,26,0.1);
    padding:6px 14px;border-radius:100px;
    letter-spacing:0.03em;text-transform:uppercase;
    margin-bottom:20px;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--orange);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  h1{
    font-family:'Sora',sans-serif;
    font-size:42px;font-weight:800;line-height:1.2;
    margin-bottom:16px;
  }
  h1 .grad{
    background:var(--grad-orange);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    color:var(--text-dim);font-size:16px;font-weight:500;
    max-width:420px;margin:0 auto 34px;
  }
  .sub #featureName{color:var(--text);font-weight:700;}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:38px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 26px;border-radius:12px;
    font-weight:700;font-size:15px;
    border:none;cursor:pointer;font-family:inherit;
    transition:transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    white-space:nowrap;
  }
  .btn-primary{
    background:var(--grad-orange);color:#fff;box-shadow:var(--sh-orange);
  }
  .btn-primary:hover{transform:scale(1.05);box-shadow:0 16px 38px rgba(255,61,30,0.42);}
  .btn-primary:active{transform:scale(0.96);}
  .btn-dark{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);box-shadow:var(--sh-sm);
  }
  .btn-dark:hover{transform:scale(1.05);background:#20202f;box-shadow:var(--sh-md);}
  .btn-dark:active{transform:scale(0.96);}

  .notify-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px 24px;
    box-shadow:var(--sh-sm);
    text-align:left;
  }
  .notify-card p{font-size:13.5px;color:var(--text-dim);margin-bottom:14px;font-weight:600;}
  .notify-row{display:flex;gap:10px;}
  .notify-row input{
    flex:1;min-width:0;
    padding:13px 16px;border-radius:11px;
    background:var(--bg);border:1px solid var(--border);
    color:var(--text);font-size:14.5px;font-family:inherit;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .notify-row input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,26,0.15);}
  .notify-row input::placeholder{color:var(--text-faint);}
  .notify-row .btn{padding:13px 20px;flex-shrink:0;}
  .notify-msg{font-size:13px;font-weight:700;margin-top:12px;display:none;}
  .notify-msg.show{display:block;}
  .notify-msg.ok{color:#3AD07A;}

  @media(max-width:480px){
    h1{font-size:32px;}
    .notify-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="stars"></div>

<svg style="display:none">
  <defs>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
  </defs>
</svg>

<div class="topbar">
  <a href="index.html" class="brand">
    <span class="mark">৳</span>
    <span>earn</span><span class="bangla">bangla</span>
  </a>
</div>

<div class="main">
  <div class="card">
    <div class="badge-icon"><svg class="icon"><use href="#i-clock"></use></svg></div>
    <div class="eyebrow"><span class="dot"></span> Under Construction</div>
    <h1><span class="grad">Coming Soon</span></h1>
    <p class="sub"><span id="featureName">This feature</span> is on its way. We're working hard to bring it to you — check back soon!</p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary"><svg class="icon"><use href="#i-home"></use></svg> Back to Home</a>
    </div>
    <div class="notify-card">
      <p>Want to know the moment it launches?</p>
      <form id="notifyForm">
        <div class="notify-row">
          <input type="email" id="notifyEmail" placeholder="you@email.com" required>
          <button type="submit" class="btn btn-dark"><svg class="icon"><use href="#i-send"></use></svg> Notify Me</button>
        </div>
      </form>
      <div class="notify-msg ok" id="notifyMsg">Thanks! We'll let you know as soon as this goes live.</div>
    </div>
  </div>
</div>

<script>
  // Reads ?feature=Surveys from the URL so one file can be reused for
  // every not-yet-built page (Surveys, Shop, Referrals, Rewards, Support, etc.)
  const params = new URLSearchParams(window.location.search);
  const feature = params.get('feature');
  if(feature){
    document.getElementById('featureName').textContent = feature;
    document.title = feature + ' — Coming Soon — earnbangla';
  }

  // Front-end only for now — just stores the email locally and shows a
  // thank-you message. Wire this up to a real endpoint later if needed.
  document.getElementById('notifyForm').addEventListener('submit', function(e){
    e.preventDefault();
    const msg = document.getElementById('notifyMsg');
    msg.classList.add('show');
    this.querySelector('input').value = '';
  });
</script>

</body>
</html>
